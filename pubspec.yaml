name: goexperts_app
description: "Go Experts - Freelancing, Investment & Startup platform mobile app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.1
  equatable: ^2.0.7

  # Routing
  go_router: ^16.1.0

  # Networking (API-ready)
  dio: ^5.7.0

  # Models / codegen (available for future use)
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # UI
  cached_network_image: ^3.4.1
  flutter_html: ^3.0.0-beta.2
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  intl: ^0.20.2
  video_player: ^2.11.1

  # Utilities
  url_launcher: ^6.3.1
  share_plus: ^10.0.3
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.4
  package_info_plus: ^8.3.0
  path: ^1.9.1

  # Firebase & push
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  firebase_analytics: ^11.6.0
  flutter_local_notifications: ^18.0.1

  # Realtime
  socket_io_client: ^3.1.2

  # Payments
  easebuzz_flutter: ^0.0.8

  # Social login
  google_sign_in: ^6.3.0
  sign_in_with_apple: ^7.0.1
  country_code_picker: ^3.4.1
  phone_numbers_parser: ^9.0.24
  pretty_dio_logger: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

  # Codegen tooling (available for future use)
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.9.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/
    - assets/videos/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo.png"
  macos:
    generate: true
